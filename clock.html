<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Clock</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400&display=swap" rel="stylesheet"/>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  background: transparent;
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  font-family: 'DM Sans', sans-serif;
}

.widget {
  text-align: center;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
}

.day {
  font-size: 11px;
  font-weight: 400;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: #bbb0a8;
}

.time {
  font-size: 42px;
  font-weight: 300;
  letter-spacing: -0.01em;
  color: #6e6560;
  line-height: 1;
  font-variant-numeric: tabular-nums;
  font-feature-settings: "tnum";
}

.ampm {
  font-size: 12px;
  font-weight: 400;
  letter-spacing: 0.12em;
  color: #c4bab4;
  margin-top: 2px;
}
</style>
</head>
<body>
<div class="widget">
  <div class="day"  id="day"></div>
  <div class="time" id="time"></div>
  <div class="ampm" id="ampm"></div>
</div>

<script>
const DAYS = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];

function tick() {
  const now  = new Date();
  const h    = now.getHours();
  const m    = now.getMinutes();
  const h12  = h % 12 || 12;

  document.getElementById('day').textContent  = DAYS[now.getDay()];
  document.getElementById('time').textContent = `${String(h12).padStart(2,'0')}:${String(m).padStart(2,'0')}`;
  document.getElementById('ampm').textContent = h >= 12 ? 'PM' : 'AM';
}

tick();
setInterval(tick, 1000);
</script>
</body>
</html>
